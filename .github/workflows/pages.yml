name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Give scripts and styles a new address on each deploy
        run: |
          version="${GITHUB_SHA::8}"
          find site -name '*.js' -o -name '*.html' | xargs perl -pi -e "
            s#(from '\.{1,2}/[^']+\.js)'#\1?v=${version}'#g;
            s#(<script[^>]* src=\"[^\":]+\.js)\"#\1?v=${version}\"#g;
            s#(<link rel=\"stylesheet\" href=\"[^\":]+\.css)\"#\1?v=${version}\"#g;
          "
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
